<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUILD A LIFE — Stable Classroom Edition</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><small>CALLAWAY JROTC • STABLE CLASSROOM EDITION</small><h1>BUILD A LIFE</h1><p>5-Year Adult Life Simulator</p></div><button id="perf">PERFORMANCE MODE</button></header>
<main>
<section id="start" class="card hero"><small>YOU CHOOSE ONLY YOUR DIRECTION</small><h2>Build a stable life.</h2><p>Choose College, Military, Trade/Apprenticeship, or Workforce. The program assigns everything else. No rerolls.</p>
<div id="paths" class="grid"><button data-p="college">🎓<b>COLLEGE</b></button><button data-p="military">🪖<b>MILITARY</b></button><button data-p="trade">🛠️<b>TRADE / APPRENTICESHIP</b></button><button data-p="workforce">💼<b>WORKFORCE</b></button></div></section>
<section id="game" class="hide"><section class="card"><small id="path"></small><h2 id="role"></h2><p id="family"></p><div id="metrics" class="metrics"></div></section>
<section class="card"><small id="cat"></small><h2 id="q"></h2><p id="ctx"></p><div id="opts" class="options"></div></section>
<section id="result" class="card hide"><small>CONSEQUENCE</small><h2 id="rt"></h2><p id="rx"></p><button id="next">CONTINUE</button></section></section>
<section id="final" class="card hero hide"><small>FIVE YEARS LATER</small><h2 id="rank"></h2><div id="score" class="score"></div><p id="summary"></p><button onclick="location.reload()">BUILD ANOTHER LIFE</button></section>
</main><script src="app.js"></script></body></html>
